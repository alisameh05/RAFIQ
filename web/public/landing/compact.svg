<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Loading">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    circle { transform-origin: 12px 12px; animation: spin 1s linear infinite; }
