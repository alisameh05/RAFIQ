name: Local fixture smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: fixture-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_ENV_FILES: .env.fixture.example
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore browser tooling, lint and typecheck
        working-directory: web
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm run lint
          npm run typecheck
          npm exec -- playwright install --with-deps chromium
      - name: Verify public landing and driver access with signup held
        working-directory: web
        env:
          RAFIQ_LANDING_LOCAL: '1'
        run: |
          npm run build
          npm run test:e2e -- landing.spec.ts driver-access.spec.ts controlled-use.spec.ts
      - name: Verify the gated landing film and accessible media fallback
        working-directory: web
        env:
          RAFIQ_LANDING_LOCAL: '1'
        run: |
          for mode in held no-video no-captions ready; do
            RAFIQ_FILM_FIXTURE="$mode" npm run test:e2e -- landing-film.spec.ts --output="test-results/film-$mode" || exit $?
          done
      - name: Upload synthetic landing film browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-landing-film-browser
          path: web/test-results/film-*/**/film-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic profile browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-profile-browser
          path: web/test-results/**/profile-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Verify Google entry with signup open, held and Google off
        working-directory: web
        env:
          RAFIQ_LANDING_LOCAL: '1'
        run: |
          for mode in open held off; do
            RAFIQ_GOOGLE_FIXTURE="$mode" npm run test:e2e -- google-entry.spec.ts --output="test-results/google-$mode" || exit $?
          done
      - name: Upload synthetic Google entry browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-google-entry-browser
          path: web/test-results/google-*/**/google-p0*.png
          if-no-files-found: error
          retention-days: 14
      - name: Verify Apple entry and linking with signup open, held and Apple off
        working-directory: web
        env:
          RAFIQ_LANDING_LOCAL: '1'
        run: |
          for mode in open held off; do
            RAFIQ_APPLE_FIXTURE="$mode" npm run test:e2e -- apple-entry.spec.ts --output="test-results/apple-$mode" || exit $?
          done
      - name: Upload synthetic Apple entry browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-apple-entry-browser
          path: web/test-results/apple-*/**/apple-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic monitoring settings evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-monitoring-settings-browser
          path: web/test-results/**/monitoring-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Validate configuration and ignored local files
        run: |
          docker compose config --quiet
          for file in .env .env.fixture server/.env.local web/debug.log logs/fixture.txt; do
            git check-ignore "$file"
          done
          git ls-files --error-unmatch .env.fixture.example
      - name: Build and boot with an empty PostgreSQL volume
        run: |
          docker version
          docker compose version
          docker compose up --build --wait --wait-timeout 180
          docker compose ps -a
          migration="$(docker compose ps -a -q migrate)"
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$migration")" = 'exited 0'
          curl --fail --silent --show-error http://127.0.0.1:3000/healthz
          curl --fail --silent --show-error http://127.0.0.1:8000/internal/livez
          curl --fail --silent --show-error http://127.0.0.1:8000/internal/readyz
      - name: Verify synthetic Storage policy isolation
        run: |
          docker compose cp supabase/migrations/20261126232258_validation_private_object.sql db:/tmp/rafiq-validation-policy.sql
          docker compose cp ops/validation/test-storage-policy.sql db:/tmp/test-storage-policy.sql
          docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U postgres -d rafiq -f /tmp/test-storage-policy.sql
      - name: Verify hosted database role bootstrap
        shell: bash
        run: |
          container="${COMPOSE_PROJECT_NAME}-role-test"
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --network none --name "$container" \
            -e POSTGRES_PASSWORD=synthetic-only -e POSTGRES_DB=rafiq \
            postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -q -h 127.0.0.1 -U postgres -d rafiq; then break; fi
            sleep 2
          done
          docker exec "$container" pg_isready -q -h 127.0.0.1 -U postgres -d rafiq
          docker cp ops/validation/bootstrap-hosted-database.sql "$container":/tmp/rafiq-hosted-bootstrap.sql
          docker cp ops/validation/bootstrap-clerk-callback.sql "$container":/tmp/bootstrap-clerk-callback.sql
          docker cp ops/validation/test-hosted-bootstrap.sql "$container":/tmp/test-hosted-bootstrap.sql
          docker exec "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d rafiq -f /tmp/test-hosted-bootstrap.sql
      - name: Record runtime and build artifacts
        run: |
          docker compose exec -T db postgres --version
          docker compose exec -T web node --version
          docker compose exec -T web npm --version
          docker compose exec -T api python --version
          docker compose exec -T api uv --version
          docker compose exec -T worker python --version
          docker compose exec -T worker uv --version
          docker compose exec -T worker Rscript --version
          docker compose exec -T worker Rscript --vanilla -e 'print(packageVersion("renv")); print(packageVersion("jsonlite"))'
          docker compose images
          api_image=$(docker image inspect --format '{{.Id}}' "$(docker compose images -q api)")
          worker_image=$(docker image inspect --format '{{.Id}}' "$(docker compose images -q worker)")
          printf 'API_IMAGE_ID=%s\nWORKER_IMAGE_ID=%s\n' "$api_image" "$worker_image" >> "$GITHUB_ENV"
          sha256sum web/package-lock.json server/uv.lock server/renv.lock
      - name: Verify browser submission, reload and identity denial
        working-directory: web
        run: npm run test:e2e
      - name: Verify R output, runtime grants and lease fencing
        run: |
          docker compose stop worker
          docker compose run --build --rm --no-deps worker-test
      - name: Recreate containers and verify persisted result
        run: |
          docker compose down
          docker compose up --wait --wait-timeout 180
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer local-driver-a' http://127.0.0.1:8000/api/v1/local-fixtures/current \
            | jq -e '.status == "completed" and .result == {"version":1,"method":"synthetic-mean-v1","count":3,"mean":4}'
      - name: Render and compare PDF and Word from the persisted fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fontconfig fonts-dejavu-core
          docker compose --profile render build renderer
          bash ops/fixture-render/smoke.sh
      - name: Upload synthetic render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-render-fixture
          path: logs/render-fixture/
          if-no-files-found: error
          retention-days: 14
      - name: Stop the smoke stack before the recovery drill
        run: docker compose down
      - name: Verify populated upgrade, probes, drain, reclaim and browser recovery
        working-directory: web
        env:
          RAFIQ_RECOVERY_DRILL: '1'
          RAFIQ_RECOVERY_IMAGE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
        run: npm run test:e2e -- recovery.spec.ts
      - name: Scan the built API and worker images
        shell: bash
        run: |
          archive="$RUNNER_TEMP/trivy_0.70.0_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9 "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" trivy
          trivy="$RUNNER_TEMP/trivy"

          "$trivy" image --download-db-only
          "$trivy" --version
          status=0
          for image in "$API_IMAGE_ID" "$WORKER_IMAGE_ID"; do
            echo "Scanning $image"
            "$trivy" image --image-src docker --scanners vuln --skip-db-update \
              --severity HIGH,CRITICAL --exit-code 1 "$image" || status=1
          done
          exit "$status"
      - name: Show fixture logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable fixture
        if: always()
        run: docker compose down --volumes
